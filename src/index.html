<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선물이 도착했어요</title>
  <meta name="description" content="열어 보려면 링크를 눌러 주세요">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8F4">
  <meta property="og:type" content="website">
  <meta property="og:title" content="선물이 도착했어요">
  <meta property="og:description" content="열어 보려면 링크를 눌러 주세요">

  <!-- 허용 외부 호스트: cdn.jsdelivr.net, fonts.googleapis.com, fonts.gstatic.com (design/05) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- JS가 꺼져 있으면 폼을 숨깁니다. 정답이 주소(URL)에 남지 않게 하기 위해서입니다. (ADR-051) -->
  <noscript><style>#app { display: none; }</style></noscript>
</head>
<body>
  <noscript>
    <p class="noscript-notice">이 페이지는 자바스크립트가 필요해. 브라우저 설정에서 켜 줘.</p>
  </noscript>

  <main id="app">
    <!-- 잠금 화면 -->
    <section id="screen-lock" class="screen" aria-labelledby="lock-question">
      <!-- 입력창에 name 속성을 두지 않습니다. 기본 제출이 일어나도 값이 전송되지 않습니다. (ADR-051) -->
      <form id="lock-form" class="card" autocomplete="off" novalidate>
        <h1 id="lock-question" class="question" tabindex="-1">우리가 사귀기 시작한 날짜는?</h1>
        <input id="answer" type="text" class="field"
               aria-labelledby="lock-question" aria-describedby="status"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <!-- JS가 연결되기 전에는 비활성입니다. 연결되면 app.js가 활성화합니다. -->
        <button id="submit" type="submit" class="button" disabled>열어 보기</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- 오류 화면 (데이터 오류, 버전 오류, 보안 컨텍스트 아님) -->
    <section id="screen-error" class="screen" aria-labelledby="error-message" hidden>
      <div class="card" role="alert">
        <h1 id="error-message" class="question" tabindex="-1"></h1>
      </div>
    </section>

    <!-- 선물 상자 화면 (ADR-053). 상자는 장식이므로 스크린리더에는 숨기고 버튼 이름으로 알립니다. -->
    <section id="screen-gift" class="screen" aria-labelledby="gift-hint" hidden>
      <div class="card gift-card">
        <h1 id="gift-hint" class="question" tabindex="-1">상자를 눌러서 열어 봐</h1>
        <button id="gift-button" type="button" class="gift" aria-label="선물 상자 열기">
          <span class="gift-box" aria-hidden="true">
            <span class="gift-lid"><span class="gift-bow"></span></span>
            <span class="gift-body"></span>
          </span>
        </button>
      </div>
    </section>

    <!-- 카드 화면: 카드를 한 장씩 넘깁니다. (ADR-047, ADR-053) -->
    <section id="screen-cards" class="screen" hidden>
      <article id="card-voucher" class="card voucher" data-card tabindex="-1" hidden aria-labelledby="voucher-title">
        <img class="logo" src="img/logo.jpg" width="720" height="207" alt="리스파이어랩 로고">
        <p id="voucher-label" class="voucher-label"></p>
        <p id="voucher-badge" class="voucher-badge"></p>
        <h1 id="voucher-title" class="voucher-title"></h1>
        <p id="voucher-subtitle" class="voucher-subtitle"></p>
        <dl class="voucher-rows">
          <div class="voucher-row"><dt>Recipient</dt><dd id="voucher-recipient"></dd></div>
          <div class="voucher-row"><dt>Occasion</dt><dd id="voucher-occasion"></dd></div>
          <div class="voucher-row"><dt>Center</dt><dd id="voucher-center"></dd></div>
          <div class="voucher-row"><dt>Care Type</dt><dd id="voucher-careType"></dd></div>
        </dl>
        <button type="button" class="button" data-next>다음</button>
      </article>

      <!-- 임시 카드: v0.3에서 편지 카드가 생기면 삭제합니다. -->
      <article id="card-temp" class="card" data-card tabindex="-1" hidden aria-labelledby="temp-title">
        <h1 id="temp-title" class="question">다음 카드는 곧 준비돼.</h1>
      </article>
    </section>
  </main>

  <!-- 폭죽용 캔버스 (ADR-055). 장식이므로 스크린리더에는 숨기고, 눌러도 아래로 통과합니다. -->
  <canvas id="confetti" class="confetti" aria-hidden="true" hidden></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
